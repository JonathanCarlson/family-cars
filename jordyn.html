<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Jordyn's first car</title>
  <meta name="description" content="Safe, low-cost first cars — shortlist" />
  <!-- Keep this page out of search engines and don't leak the URL/path. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jordyn's Car" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="apple-touch-icon" href="icons/car-icon-180.png" />
  <link rel="icon" sizes="192x192" href="icons/car-icon-192.png" />
  <link rel="icon" sizes="512x512" href="icons/car-icon-512.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Page chrome layered on top of the shared styles.css */
    .cars-head {
      padding: calc(16px + var(--safe-top)) 16px 6px;
      position: sticky; top: 0; z-index: 5;
      background: linear-gradient(var(--bg) 82%, transparent);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .cars-head h1 { font-size: 21px; margin: 0; }
    .cars-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    #share-btn {
      flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 8px 13px; border-radius: 999px;
      border: 1px solid var(--accent); color: var(--accent); background: transparent;
      white-space: nowrap; cursor: pointer;
    }
    #share-btn:active { background: var(--accent); color: var(--bg); }
    /* Toast used by car-common.js for the copied-link confirmation. */
    .toast {
      position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translateX(-50%);
      background: rgba(8,12,24,.95); color: var(--text); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 40;
      opacity: 0; pointer-events: none; transition: opacity .25s ease; max-width: 88vw; text-align: center;
    }
    .toast.on { opacity: 1; }
    .cars-wrap { padding: 0 16px calc(120px + var(--safe-bottom)); max-width: 760px; margin: 0 auto; }
    #cars-status { padding: 40px 22px; text-align: center; color: var(--muted); }
    #cars-status .big { font-size: 40px; margin-bottom: 10px; }

    /* Intro card + headline stats. .stat-grid is NOT in the shared styles.css —
       without these rules the three numbers stack vertically as bare text. */
    .lede { margin: 0 0 10px; font-size: 13.5px; line-height: 1.5; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .stat .n { font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.1; }
    .stat .l { font-size: 10.5px; color: var(--muted); margin-top: 3px; line-height: 1.25; }

    /* ---- Tabs ----
       IMPORTANT: the shared styles.css defines .tabbar as the TRIP app's
       7-column bottom-fixed nav (position:fixed; bottom:0; z-index:20) and .tab
       as a column-flex icon+label button. Kate's cars.html hit exactly this:
       the inherited positioning pinned its tab bar to the bottom of the screen
       where the equally-fixed, taller #sendbar painted over it, leaving the tab
       invisible AND untappable. Reset EVERY inherited property here, not just
       display. See .github/skills/car-site/SKILL.md. */
    .tabbar {
      position: static; bottom: auto; left: auto; right: auto; z-index: auto;
      background: transparent; backdrop-filter: none; border-top: 0;
      display: flex; gap: 6px; padding: 4px 16px 8px; max-width: 760px; margin: 0 auto;
      /* Four tabs of nowrap text are wider than a phone, so the bar must scroll
         on its own rather than pushing the document wide.
         ⚠️ min-width:0 is what MAKES that work. The shared styles.css sets
         main#app to display:flex, so this nav is a flex ITEM, and a flex item's
         default min-width:auto floors it at its content width — 592px inside a
         375px viewport. overflow-x never gets a chance to engage, and the whole
         page scrolls sideways instead. Same family of bug as the .tabbar
         positioning inherited from the trip app; see car-site/SKILL.md. */
      min-width: 0;
      /* main#app is a COLUMN flex container, so its children are sized by their
         content on the cross (horizontal) axis unless told to stretch. That is
         why min-width:0 alone didn't help — the bar wasn't being shrunk, it was
         being content-sized at 592px. Forcing the width is what actually
         constrains it so overflow-x can scroll. */
      width: 100%;
      align-self: stretch;
      box-sizing: border-box;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
    }
    .tabbar::-webkit-scrollbar { display: none; }
    .tab {
      /* Natural width, no shrinking: `flex: 1 1 auto` fought the nowrap and
         pushed the container past the viewport rather than letting it scroll. */
      flex: 0 0 auto; font-size: 14px; font-weight: 600; padding: 9px 12px; border-radius: 999px;
      flex-direction: row; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--border); background: var(--bg2); color: var(--muted);
      cursor: pointer; white-space: nowrap; scroll-snap-align: start;
    }
    .tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .panel[hidden] { display: none; }
    /* Do NOT set overflow-x:hidden on the document. It stops the page scrolling
       sideways, but it does so by CLIPPING anything wider than the viewport —
       so the six-column data tables became truncated AND unreachable. The fix
       for a wide child is to let the CHILD scroll, never to hide the overflow. */
    html, body { max-width: 100%; }
    /* Every direct child of the flexed main#app needs min-width:0 for the same
       reason as .tabbar — otherwise a wide table inside floors the whole column
       at its content width and the page scrolls sideways. */
    #app > *, .cars-wrap, .panel {
      min-width: 0;
      /* Same cross-axis rule as .tabbar: without stretch these are sized by
         their widest child, so one wide table drags the whole column past the
         viewport. */
      align-self: stretch;
      width: 100%;
      box-sizing: border-box;
    }
    .card, .brow { overflow-wrap: anywhere; min-width: 0; }
    /* Horizontal scroller for the data tables. They genuinely don't fit a phone,
       and squeezing them made the narrow columns wrap one digit per line. */
    .tscroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      /* Bleed to the card edges so it's obvious there is more to the right. */
      margin: 0 -12px;
      padding: 0 12px;
    }
    /* `min-width: max-content` on a table that is also `width: 100%` creates a
       cyclic size resolution — the browser gave up and returned a 1,000,000px
       table, which "scrolled" but to nowhere useful. Let the table size to its
       own content instead, with a floor of the scroller width so short tables
       still fill the card. */
    .tscroll table { width: auto; min-width: 100%; }
    /* Tell people the table scrolls. A cut-off table with no affordance reads as
       broken rendering rather than as "there is more over here". */
    .tscroll-hint {
      font-size: 11px; color: var(--muted); margin: 4px 0 0; display: flex;
      align-items: center; gap: 4px;
    }

    /* ---- Controls ---- */
    #sortbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 6px 0 10px; }
    .sortlbl { font-size: 13px; color: var(--muted); }
    #sortbar select {
      background: var(--bg2); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 7px 10px; font-size: 13.5px; margin-left: 4px;
    }
    .horizon { display: flex; gap: 4px; margin-left: auto; }
    .hz {
      font-size: 12.5px; padding: 7px 11px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg2); color: var(--muted); white-space: nowrap;
    }
    .hz.on { background: var(--blue); border-color: var(--blue); color: #fff; }

    #filterbar { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .fgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .flabel { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); min-width: 68px; }
    .facet {
      font-size: 12.5px; padding: 6px 11px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text);
    }
    .facet.on { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* ---- Safety tier sections ---- */
    .tier { margin: 22px 0 8px; }
    .tier-h { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
    .tier-n { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
    .tier-blurb { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.4; }
    .tier-verify .tier-h { color: #f0c674; }
    .tier-no .tier-h { color: #e08b8b; }

    /* ---- Car cards ---- */
    .car {
      position: relative; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; margin-bottom: 14px;
    }
    .car.standout { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .ribbon {
      position: absolute; top: 10px; left: 10px; z-index: 2; font-size: 11px; font-weight: 700;
      background: var(--blue); color: #fff; padding: 4px 9px; border-radius: 999px;
    }
    .car-photo { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--bg2); }
    /* No-photo placeholder. Roughly 1 in 12 listings has no dealer photo, and
       those are almost always brand-new listings — which are exactly the ones
       carrying the "🆕 Just added" ribbon. With nothing to sit on, the ribbon
       landed on top of the car's title. Reserving the same 16:10 block keeps the
       ribbon anchored and the layout identical either way. */
    .car-photo-none {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      background: linear-gradient(160deg, var(--bg2), var(--card));
      border-bottom: 1px solid var(--border); text-align: center; padding: 10px;
    }
    .cpn-glyph { font-size: 30px; opacity: .5; line-height: 1; }
    .cpn-text { font-size: 13px; font-weight: 600; color: var(--muted); }
    .cpn-sub { font-size: 11px; color: var(--muted); opacity: .7; }
    .car-body { padding: 12px 14px 14px; }
    .car-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .car-head h3 { font-size: 15.5px; margin: 0; line-height: 1.3; }
    .trim { font-weight: 500; color: var(--muted); font-size: 13px; }
    .price { font-size: 17px; font-weight: 700; white-space: nowrap; }
    .car-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
    .pricenote { font-size: 12px; color: #7fd08a; margin-top: 3px; }

    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0 2px; }
    .sb {
      font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
      background: var(--bg2); border: 1px solid var(--border); color: var(--muted);
    }
    .sb-ok { color: #8fd8a0; border-color: #2f5c3c; background: #14251a; }
    .sb-warn { color: #f0c674; border-color: #5c4a1f; background: #241f12; }
/* Reserved for facts that should stop you reading further — a rebuilt total
   loss, frame or flood damage. Deliberately louder than .sb-warn, which means
   "check this", not "this is disqualifying". */
.sb-bad { color: #ff9a9a; border-color: #7a2f2f; background: #2a1414; font-weight: 600; }
    .sb-bad { color: #e08b8b; border-color: #5c2f2f; background: #241414; }

    .standout-note { font-size: 12.5px; color: var(--accent); margin: 9px 0 0; line-height: 1.45; }
    .fineprint { font-size: 11.5px; color: var(--muted); margin: 7px 0 0; line-height: 1.45; }
.fineprint-bad { color: #ffb3b3; background: #2a1414; border: 1px solid #7a2f2f; border-radius: 8px; padding: 7px 9px; }
/* Jordyn's subjective hide control. Styled quietly — it is a taste filter, not a
   verdict, and must not read like a safety judgement. */
.hide-btn {
  background: transparent; color: var(--muted); border: 1px solid #2c3550;
  border-radius: 999px; padding: 6px 11px; font-size: 12px; cursor: pointer;
}
.hide-btn:hover { color: #e6ecff; border-color: #46527a; }
.band-tbl th, .band-tbl td {
  font-size: 12px; padding: 5px 8px; text-align: left;
  /* Without this the browser squeezes narrow columns until a three-digit
     count wraps to one digit per line, which is how "1244" rendered as a
     vertical stack. Let the table be wide and scroll instead. */
  white-space: nowrap;
}
.band-tbl th:first-child, .band-tbl td:first-child { white-space: normal; min-width: 120px; }
.band-tbl tr:first-child th { color: var(--muted); font-weight: 600; }
.band-pref th, .band-pref td { background: #14251a; }
.ins-h { font-size: 16px; margin: 0 0 6px; }
.ins-verdict { font-size: 13.5px; line-height: 1.5; color: #dbe4ff; margin: 0 0 10px; }
.viewbar { display: flex; gap: 8px; margin: 4px 0 10px; }
.vw {
  flex: 1; background: #131a2e; color: var(--muted); border: 1px solid #2c3550;
  border-radius: 999px; padding: 9px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.vw.on { background: #1d2b56; color: #eaf0ff; border-color: #3d548f; }
/* Slim browse row — enough to scan and filter, without the 16 KB of detail that
   made a 320-car bundle weigh 6.8 MB. Still fully votable: the family should be
   able to react to any car they see, not just the shortlisted ones. */
.brow {
  background: var(--card); border: 1px solid #212a44; border-radius: 12px;
  padding: 10px 12px; margin-bottom: 8px;
}
.brow-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.brow.is-hidden { opacity: 0.45; }
.brow-t { font-size: 14px; font-weight: 600; }
.brow-s { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.brow-r { text-align: right; flex: 0 0 auto; }
.brow-tco { font-size: 15px; font-weight: 700; }
.brow .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.brow .note-input { margin-top: 8px; }
.band-tbl td.thin { color: var(--muted); }
/* Delta colouring on the picks comparison. Green/red here means "cheaper/dearer
   than the algorithm's picks", never "good/bad car" — she is allowed to want an
   expensive car, the page just has to say what it costs. */
.dlt-bad { color: #ff9a9a; font-weight: 600; }
.dlt-good { color: #8fd8a0; font-weight: 600; }
.pick-wrap { margin-bottom: 4px; }
.pick-wrap > .fineprint { margin: 10px 0 4px; }
.opp { border-top: 1px solid #212a44; padding: 10px 0 4px; }
.opp:first-of-type { border-top: 0; }
.opp-h { font-size: 14px; font-weight: 600; }
.opp-s { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
/* Deliberately quiet next to "Send my picks" — clearing is destructive and
   should never be the easy mis-tap. */
.clear-btn {
  background: transparent; color: var(--muted); border: 1px solid #2c3550;
  border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  margin-left: auto; white-space: nowrap;
}
.clear-btn:hover { color: #ffb3b3; border-color: #7a2f2f; }

    /* ---- TCO disclosure ---- */
    .tco { margin-top: 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; }
    .tco summary { cursor: pointer; padding: 9px 12px; font-size: 13.5px; list-style: none; }
    .tco summary::-webkit-details-marker { display: none; }
    .tco summary::after { content: '▾'; float: right; color: var(--muted); }
    .tco[open] summary::after { content: '▴'; }
    .tco-mo { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
    .tco-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 0 0 4px; }
    .tco-tbl td { padding: 4px 12px; color: var(--muted); }
    .tco-tbl td:last-child { text-align: right; color: var(--text); }
    .tco-total td { border-top: 1px solid var(--border); font-weight: 700; color: var(--text); padding-top: 7px; }
    .tco-note { font-size: 11px; color: var(--muted); padding: 0 12px 10px; margin: 0; line-height: 1.4; }

    /* ---- Assumptions disclosure ---- */
    .assump { margin-top: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; }
    .assump summary { cursor: pointer; padding: 10px 12px; font-size: 13.5px; font-weight: 600; list-style: none; }
    .assump summary::-webkit-details-marker { display: none; }
    .assump summary::after { content: '▾'; float: right; color: var(--muted); }
    .assump[open] summary::after { content: '▴'; }
    .assump-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .assump-tbl th {
      text-align: left; vertical-align: top; padding: 7px 6px 7px 12px; width: 34%;
      color: var(--muted); font-weight: 600; white-space: nowrap;
    }
    .assump-tbl td { padding: 7px 12px 7px 6px; color: var(--text); }
    .assump-tbl .why { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; font-weight: 400; }

    /* ---- Reliability disclosure ---- */
    .rel { margin-top: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; }
    .rel summary { cursor: pointer; padding: 9px 12px; font-size: 13.5px; list-style: none; }
    .rel summary::-webkit-details-marker { display: none; }
    .rel summary::after { content: '▾'; float: right; color: var(--muted); }
    .rel[open] summary::after { content: '▴'; }
    .rel-body { padding: 0 12px 10px; }
    .rel-head { font-size: 13.5px; margin-bottom: 5px; }
    .rel-conf { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
    .rel-list { margin: 0 0 6px; padding-left: 18px; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .rel-list li { margin: 3px 0; }
    .rel-stats { font-size: 11.5px; color: var(--muted); opacity: .85; }
    .rel-batt { font-size: 12px; color: var(--text); margin-top: 8px; line-height: 1.45;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
    .rel-caveat { font-size: 10.5px; color: var(--muted); margin: 8px 0 0; line-height: 1.4; opacity: .85; }
    .rel-caveat a { color: var(--accent); text-decoration: none; }

    /* ---- Actions ---- */
    .actions { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
    .vote {
      font-size: 17px; line-height: 1; padding: 7px 13px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg2);
    }
    .vote.on { background: var(--blue); border-color: var(--blue); }
    .listing { margin-left: auto; font-size: 12.5px; color: var(--accent); text-decoration: none; }
    .note-input {
      width: 100%; margin-top: 9px; padding: 8px 11px; font-size: 13px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text);
    }
    .empty { color: var(--muted); text-align: center; padding: 32px 12px; }

    /* ---- Guide tab ---- */
    .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 12px 0 4px; }
    .glist { margin: 0; padding-left: 18px; font-size: 13px; }
    .glist li { margin: 4px 0; }
    .gmodel { margin-bottom: 12px; }
    .resource-row { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .resource-row a { font-size: 13px; color: var(--accent); text-decoration: none; }

    /* ---- Sticky send bar ---- */
    .sendbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      display: flex; align-items: center; gap: 12px;      padding: 10px 16px calc(10px + var(--safe-bottom));
      background: rgba(15,21,42,.96); border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .tally { font-size: 13px; color: var(--muted); }
    #send-btn {
      margin-left: auto; background: var(--blue); color: #fff; border: none;
      border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    #send-btn:disabled { opacity: .45; cursor: default; }

    /* ---- Access gate ---- */
    #gate { max-width: 420px; margin: 12vh auto; padding: 0 22px; text-align: center; }
    #gate h1 { font-size: 22px; }
    #gate input {
      width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 12px; margin-top: 14px;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text);
    }
    #gate button {
      width: 100%; margin-top: 10px; padding: 12px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 12px; background: var(--blue); color: #fff; cursor: pointer;
    }
    #gate-error { color: #e08b8b; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- Access gate (shown only when the link has no #k= key) -->
  <section id="gate" hidden>
    <div style="font-size:44px">🚗</div>
    <h1>Jordyn's first car</h1>
    <p style="color:var(--muted);font-size:14px">Enter the access code <em>or</em> the passphrase to see the list.</p>
    <form id="gate-form">
      <input id="gate-code" type="password" placeholder="Access code or passphrase" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button id="gate-btn" type="submit">View cars</button>
      <p id="gate-error" hidden></p>
    </form>
  </section>

  <main id="app" hidden>
    <div class="cars-head">
      <div class="cars-head-main">
        <h1>Jordyn's first car</h1>
        <div class="sub" id="head-sub">Safety first, then cost to own</div>
      </div>
      <button id="share-btn" type="button" hidden>🔗 Share</button>
    </div>

    <nav id="tabbar" class="tabbar" hidden>
      <button class="tab active" type="button" data-tab="cars">🚗 The cars</button>
      <button class="tab" type="button" data-tab="picks">👤 Jordyn's picks</button>
      <button class="tab" type="button" data-tab="insights">📊 What the data says</button>
      <button class="tab" type="button" data-tab="guide">📋 Buyer's guide</button>

    <div class="cars-wrap">
      <div id="cars-status"><div class="big">🚗</div>Decrypting…</div>

        <div id="viewbar" class="viewbar" role="group" aria-label="Which cars to show">

  <script src="car-common.js?v=3"></script>
